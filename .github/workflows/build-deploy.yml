name: Build and deploy

# Every push to main builds the website and the Android APK, puts the APK on the website at
# /download/BestFireWorks.apk (short link: /app) and deploys both to Firebase Hosting together.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      # ── Android APK ────────────────────────────────────────────────────────────
      # The native Android project is generated fresh on every build, so nothing Android-specific lives in the repo.
      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Set version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Uses your own signing key from the ANDROID_* secrets (README step 5), so phones can install updates over
      # the old app. Without them a throwaway key is used and users must uninstall before updating.
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Signing with a temporary key; installing an update will require uninstalling the old app first."
            KS_PASS=temporary KEY_PASS=temporary KEY_ALIAS=temp
            keytool -genkeypair -keystore release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Best FireWorks"
          fi
          export KS_PASS KEY_PASS
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out BestFireWorks.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs BestFireWorks.apk | head -3
          rm -f release.jks

      # Added after `cap sync`, so the APK is served by the website but not packed inside itself.
      - name: Put the APK on the website
        run: |
          mkdir -p dist/download
          cp BestFireWorks.apk dist/download/BestFireWorks.apk

      # Private copy for the repo owner (Actions tab → run → Artifacts). Not shown to customers.
      - uses: actions/upload-artifact@v4
        with:
          name: BestFireWorks-apk
          path: BestFireWorks.apk
          retention-days: 30

      # ── Deploy website + APK ───────────────────────────────────────────────────
      - name: Firebase deploy key missing
        if: env.HAS_FIREBASE_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set, so nothing was deployed. See README step 4."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
