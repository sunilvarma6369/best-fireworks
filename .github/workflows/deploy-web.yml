name: Deploy website

# Every push to main publishes the website to Firebase Hosting.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # Needs the FIREBASE_SERVICE_ACCOUNT secret (README step 4). Project id comes from .firebaserc.
      # Until the secret exists the site is only built (deploy by hand with `npm run deploy`).
      - name: Firebase deploy key missing
        if: env.HAS_FIREBASE_KEY != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set, so the website was built but not deployed. See README step 4."

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
